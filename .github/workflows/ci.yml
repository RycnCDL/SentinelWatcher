name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SentinelWatcher.sln

      - name: Build
        run: dotnet build SentinelWatcher.sln -c Release --no-restore

      - name: Test
        run: dotnet test SentinelWatcher.sln -c Release --no-build --verbosity normal

      - name: Check for vulnerable packages
        run: |
          dotnet list SentinelWatcher.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  infra:
    name: Bicep lint and compiled template check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bicep
        run: az bicep install --version v0.48.1

      - name: Lint
        run: |
          az bicep lint --file infra/main.bicep
          az bicep lint --file infra/modules/workspace-access.bicep

      - name: Check that infra/azuredeploy.json matches infra/main.bicep
        run: |
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/azuredeploy.json"
          # Compare the templates without the generator metadata (Bicep version and hash).
          jq -S 'del(.metadata._generator)' infra/azuredeploy.json > "$RUNNER_TEMP/committed.json"
          jq -S 'del(.metadata._generator)' "$RUNNER_TEMP/azuredeploy.json" > "$RUNNER_TEMP/built.json"
          if ! diff -u "$RUNNER_TEMP/committed.json" "$RUNNER_TEMP/built.json"; then
            echo "::error::infra/azuredeploy.json is out of date. Run: az bicep build --file infra/main.bicep --outfile infra/azuredeploy.json"
            exit 1
          fi

  package:
    name: Deployable package
    runs-on: ubuntu-latest
    needs: [api, client]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Build package
        shell: pwsh
        run: ./scripts/build-package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: sentinelwatcher-package
          path: artifacts/sentinelwatcher.zip
          retention-days: 7
